server {
    # --- Paramètres Généraux du Serveur ---
    listen 8080;
    host 127.0.0.1;
    server_name ma_fusion_web.com;
    
    # Racine par défaut et fichier d'accueil
    root docs/fusion_web/;
    index index.html;

    # Sécurité : Limite la taille des requêtes clients (3 Mo)
    client_max_body_size 3000000;

    # Gestion des erreurs
    error_page 404 error_pages/404.html;
    error_page 500 502 503 504 error_pages/50x.html;

    # --- 1. Route Racine (/) ---
    # Illustration des méthodes acceptées et de l'autoindex désactivé
    location /
    {
        allow_methods GET POST;
        autoindex off;
    }

    # --- 2. Route avec Redirection (HTTP redirection) ---
    # Tout ce qui arrive sur /ancien-chemin est envoyé vers /tours
    location /ancien-chemin 
    {
        return 301 /tours;
    }

    # --- 3. Route avec Racine Spécifique (Root mapping) ---
    # Si l'URL est /kapouet, le serveur cherche dans /tmp/www
    # Exemple: /kapouet/pouic -> /tmp/www/pouic
    location /kapouet
    {
        root /tmp/www;
        allow_methods GET;
        autoindex on; # Listing des fichiers activé ici
    }

    # --- 4. Route pour les Téléchargements (Upload) ---
    # Autorise l'envoi de fichiers et définit le dossier de stockage
    location /upload
    {
        allow_methods POST PUT;
        upload_enable on;
        upload_store /tmp/www/uploads;
    }

    # --- 5. Route pour le Contenu Dynamique (CGI) ---
    # Définit les fichiers par défaut et les interprètes
    location /cgi-bin
    {
        root ./scripts;
        allow_methods GET POST;
        index time.py;
        cgi_ext .py .sh;
        cgi_path /usr/bin/python3 /bin/bash;
    }

    # --- 6. Route avec Fichier par Défaut Spécifique (Default file) ---
    location /tours
    {
        root docs/fusion_web/tours_dossier;
        index tours_accueil.html;
        allow_methods GET;
        autoindex on;
    }
}